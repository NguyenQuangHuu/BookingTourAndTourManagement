<article [aria-label]="id()" class="task-card">
  <header class="task-card__header">
    <h2 class="task-card__title">{{ title() }}</h2>
    <span class="task-card__state">{{ state() }}</span>
  </header>
  <div class="task-card__info">
    <p class="task-card__description">{{ description() }}</p>
  </div>
  <footer class="task-card__actions">
    <button (click)="markedCancel(id())" appButton class="btn" size="md" variant="danger">Xóa</button>
    <button (click)="restoreTask(id())" appButton class="btn" size="md" variant="secondary">Khôi phục</button>
    <button (click)="markedDone(id())" appButton class="btn" size="md" variant="primary">Xác nhận</button>
  </footer>
</article>
