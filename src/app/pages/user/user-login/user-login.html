<div class="wrapper">
    <h3>User login system</h3>
    <form class="form-login">
        <div class="form-login__field">
            <label class="form-login__label" for="username">Username</label>
            <div class="form-login__control">
                <input name="username" id="username" class="form-login__input" type="text" placeholder="Enter your username..."/>
                <i class="form-login__icon">A</i>
            </div>
            <span class="form-login__message"></span>
        </div>
        <div class="form-login__field">
            <label class="form-login__label" for="password">Password</label>
            <div class="form-login__control">
                <input name="password" id="password" class="form-login__input" type="text" placeholder="Enter your username..."/>
                <i class="form-login__icon">P</i>
            </div>
            <span class="form-login__message"></span>
        </div>
        <div class="form-login__field">
            <div class="form-login__control">
                <input id="remember-me" name="remember-me" class="form-login__checkbox" type="checkbox"/>
            </div>
            <label for="remember-me">Remember Me</label>
        </div>
        <div class="form-login__action">
            <button class="btn btn--primary" type="submit">Login</button>
        </div>
    </form>
</div>
