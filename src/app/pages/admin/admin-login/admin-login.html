<div class="wrapper">
    <h3 class="wrapper__title">Admin Login System</h3>
    <form class="wrapper__form form-login" method="post">
        <div class="form-login__group">
            <label class="form-login__label" for="username">Username</label>
            <div class="form-login__input">
                <input name="username" id="username"  type="text" placeholder="Enter your username..."/>
        
            </div>
        </div>
        <div class="form-login__group">
            <label class="form-login__label" for="password">Password</label>
            <div class="form-login__input">
                <input name="password" id="password" type="text" placeholder="Enter your username..."/>
            </div>
            <span class="form-login__message"></span>
        </div>
        <div class="form-login__checkbox checkbox">
            <input id="remember-me" name="remember-me" class="checkbox__input" type="checkbox"/>
            <label class="checkbox__label" for="remember-me">Remember Me</label>
        </div>
        <div class="form-login__action">
            <button class="btn btn--secondary">Back</button>
            <button class="btn btn--primary" type="submit">Login</button>
        </div>
    </form>
    <ul class="wrapper__message">
        <li class="wrapper__message--danger">Loi He thong</li>
    </ul>
</div>
